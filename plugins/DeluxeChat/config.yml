check_updates: true
bungeecord:
  enabled: false
  server_name: Server
  server_prefix: '&8[&cServer&8]'
  join_global: true
  use_server_whitelist: true
  server_whitelist:
  - Server2
  - Server3
relation_placeholders_enabled: true
timestamp_format: MM/dd/yy HH:mm:ss
boolean:
  'true': '&atrue'
  'false': '&cfalse'
ops_use_group_format: false
chat_filter:
  enabled: false
  ignore_case: true
  list:
  - '.; '
  - fuck;fuck
private_message:
  enabled: true
  bungeecord: false
private_message_formats:
  to_sender:
    format: '&8[&cMSG&8] &7Tú &e➡ &7%recipient_player_name%&7: '
    tooltip:
    - '%player_name%'
    click_command: '/r '
    chat_color: '&f'
  to_recipient:
    format: '&8[&cMSG&8] &7%player_name% &e➡ &7Tú&7: '
    tooltip:
    - '%player_name%'
    click_command: '/r '
    chat_color: '&f'
  social_spy: '&8[&3SPY&8] &f%player% &e➡ &f%recipient%&7: '
formats:
  default:
    priority: 1
    channel: ''
    prefix: '%rankcolor_prefix% %prisonranksx_currentrank_displayname%&r'
    name_color: '&f'
    name: ' %rankcolor_name%'
    suffix: ' &b» '
    chat_color: '&7'
    channel_tooltip:
