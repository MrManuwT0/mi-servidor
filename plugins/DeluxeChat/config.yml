# we need to download the player expansion: /papi ecloud download Player, /papi reload
#
# Color formats supported in prefix/name/suffix/chat_color/tooltips/PM formats:
#   legacy   : &c, &b, &l, etc.
#   hex      : &#RRGGBB or #RRGGBB   (needs deluxechat.hex / deluxechat.pm.hex permission for player-typed chat)
#   gradient : <gradient:#RRGGBB:#RRGGBB>text</gradient>   (2 or more stops allowed)
#   rainbow  : <rainbow>text</rainbow>  or  <rainbow:75>text</rainbow>  (optional 0-100 saturation)
#
