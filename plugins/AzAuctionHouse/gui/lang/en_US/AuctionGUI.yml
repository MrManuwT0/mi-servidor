# Navigation buttons with shulker boxes and repeater
materials:
  prev-page: SPECTRAL_ARROW
  next-page: SPECTRAL_ARROW
  back: SPECTRAL_ARROW
  search: OAK_SIGN
  filter: HOPPER
  refresh: REPEATER
  transaction-history: BOOK
  my-listings: ENDER_CHEST
# Custom head support (when enabled in config.yml)
# These will override the materials above when custom-heads.enabled is true
custom-heads:
  # Navigation buttons
  prev-page:
    enabled: true
    texture-key: previous-page # References config.yml custom-heads.textures.previous-page
    fallback-material: SPECTRAL_ARROW
  
  next-page:
    enabled: true
    texture-key: next-page # References config.yml custom-heads.textures.next-page
    fallback-material: SPECTRAL_ARROW
  
  back:
    enabled: true
    texture-key: back # References config.yml custom-heads.textures.back
    fallback-material: SPECTRAL_ARROW
  
  # Utility buttons
  search:
    enabled: true
    texture-key: search # References config.yml custom-heads.textures.search
    fallback-material: OAK_SIGN
  
  refresh:
    enabled: false # Keep using REPEATER for refresh
    texture-key: settings
    fallback-material: REPEATER
  
  # Info buttons
  transaction-history:
    enabled: true
    texture-key: info # References config.yml custom-heads.textures.info
    fallback-material: BOOK
  
  my-listings:
    enabled: false # Keep using ENDER_CHEST for my listings
    texture-key: settings
    fallback-material: ENDER_CHEST
