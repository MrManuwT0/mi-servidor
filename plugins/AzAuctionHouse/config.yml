# GUI Auto-Reload Settings
gui:
  auto-reload:
    # Enable automatic reloading of GUI configuration files when they are modified
    enabled: true
    
    # How often to check for file changes (in ticks, 20 ticks = 1 second)
    check-interval: 40
    
    # Delay before reloading after a file change is detected (in ticks)
    # This prevents reloading while the file is still being written
    delay-ticks: 20
    
    # Notify administrators when files are automatically reloaded
    notify-admins: true

# Color Theme (Yellow theme as requested)
colors:
  primary: "&e"      # Yellow
  secondary: "&6"    # Gold
  success: "&a"      # Green
  error: "&c"        # Red
  info: "&b"         # Aqua
  warning: "&e"      # Yellow

# Update Checker Settings
updater:
  # Enable automatic update checking
  enabled: true
  
  # How often to check for updates (in hours)
  check-interval-hours: 24
  
  # Notify admins when updates are available
  notify-admins: true

