# Discord Webhook Settings
webhook:
  # Enable/disable webhook notifications
  enabled: true
  
  # Discord webhook URL - REQUIRED: Set your Discord webhook URL here for notifications to work
  # Example: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  url: ""
  
  # Webhook settings
  username: "AzAuctionHouse"
  avatar-url: ""
  
  # What events to log
  events:
    item-listed: true
    item-sold: true
    item-purchased: true
    item-expired: true
    high-value-sales: true
  
  # High value sale threshold
  high-value-threshold: 10000
  
  # Retry settings for failed webhooks
  retry:
    max-attempts: 3
    delay-seconds: 5
  
  # Embed settings
  embed:
    color: 16766720  # Yellow color (#FFD700)
    footer-text: "AzAuctionHouse by GamingHuzai"
    footer-icon: ""
    
