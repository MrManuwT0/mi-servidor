# =========================================================================
#  HyperPickaxe - Definición de encantamientos
#
#  Cada encantamiento se define completamente aquí: nombre, precios, slot,
#  icono, descripción y el "effect" (la lógica Java que ejecuta, registrada
#  en EffectRegistry). Puedes añadir encantamientos nuevos sin tocar el
#  núcleo del plugin siempre que el "effect" ya exista, o registrar tu
#  propio efecto a través de la API pública (HyperPickaxeAPI#registerEffect).
# =========================================================================

