# Nota: los niveles de encantamiento aquí (X = 10) superan el límite
# vanilla y funcionan porque CrazyCrates aplica encantamientos "unsafe".
# Si quieres igualarlos a la escala de tus PlayerKits2 (Sharpness 300 /
# Protection 400), solo sube el número después de los dos puntos,
# por ejemplo 'DAMAGE_ALL:300'.
