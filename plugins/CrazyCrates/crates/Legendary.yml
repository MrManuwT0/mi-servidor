# ==================================================
#  CRATE: LEGENDARY (Tier 4)
# ==================================================
Crate:
  CrateType: CSGO
  CrateName: "<bold><gold>Legendary Crate</bold>"
  Preview-Name: "<bold><gold>Legendary Crate Preview</bold>"
  StartingKeys: 0
  RequiredKeys: 1
  Max-Mass-Open: 10
  InGUI: true
  Slot: 24
  OpeningBroadCast: true
