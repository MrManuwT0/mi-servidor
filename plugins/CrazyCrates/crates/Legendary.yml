  opening-command:
    toggle: false
    commands: []
  sound:
    cycle-sound:
      toggle: true
      value: "BLOCK_NOTE_BLOCK_XYLOPHONE"
      volume: 1.0
      pitch: 1.0
    click-sound:
      toggle: true
      value: "UI_BUTTON_CLICK"
      volume: 1.0
      pitch: 1.0
    stop-sound:
      toggle: true
      value: "UI_TOAST_CHALLENGE_COMPLETE"
      volume: 1.0
      pitch: 1.0
  Prize-Message:
    - "<gray>You have won <red>%reward% <gray>from <red>%crate%."
