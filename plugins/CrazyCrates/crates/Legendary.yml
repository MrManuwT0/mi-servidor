    Item: "TRIPWIRE_HOOK"
    Glowing: true
  Hologram:
    Toggle: true
    Height: 1.5
    Range: 8
    Color: "transparent"
    Message:
      - "<bold><gold>LEGENDARY CRATE</bold>"
      - "<gray>Right click with the key"
  Prizes:
    1:
      DisplayName: "<green>$15,000"
      DisplayItem: "EMERALD_BLOCK"
      Lore:
        - "<gray>A legendary payday."
        - ""
        - "<red>Chance: <yellow>19%"
      MaxRange: 100
      Chance: 19
      Commands:
        - "eco give %player% 15000"
      Messages:
