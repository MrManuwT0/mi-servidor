# ============================================================
#  HyperSword - menus.yml
# ============================================================

main-menu:
  title: "<gradient:#FF6B35:#FFD700><bold>⚔ HyperSword</bold></gradient>"
  rows: 6
  # Slots de cristal decorativo (bordes)
  border:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  open-sound: BLOCK_CHEST_OPEN
  open-sound-volume: 0.8
  open-sound-pitch: 1.2
  # Animación de apertura
  animation:
    enabled: true
    type: WAVE  # WAVE, FADE, SPIRAL

  # Item de la espada en el centro del menú
  sword-display:
    slot: 4
    # Lore extra mostrado en el menú (además del lore de la espada)
    extra-lore:
      - ""
      - "<yellow>Click izquierdo: <white>Ver estadísticas</white>"
      - "<yellow>Click derecho: <white>Información del dueño</white>"

  # Botón de estadísticas
  stats-button:
    slot: 20
    material: BOOK
    name: "<gold><bold>📊 Estadísticas</bold></gold>"
    lore:
      - "<gray>Ver todas tus estadísticas"
      - "<gray>de combate y progreso."
    sound: UI_BUTTON_CLICK

  # Botón de encantamientos (abre submenú)
  enchants-button:
    slot: 22
    material: ENCHANTED_BOOK
    name: "<gradient:#9B59B6:#3498DB><bold>✨ Encantamientos</bold></gradient>"
    lore:
      - "<gray>Mejora los encantamientos"
      - "<gray>de tu HyperSword."
    sound: BLOCK_ENCHANTMENT_TABLE_USE

  # Botón de skins (abre submenú de apariencia)
  skins-button:
    slot: 30
    material: NETHERITE_AXE
    name: "<gradient:#FFD700:#FF8C00><bold>⚔ Skins</bold></gradient>"
    lore:
      - "<gray>Cambia el material de tu espada."
      - "<gray>Elige entre espadas, hachas y mazas."
    sound: UI_BUTTON_CLICK

  # Botón de prestigio
  prestige-button:
    slot: 24
    material: NETHER_STAR
    name: "<gradient:#FFD700:#FF6B35><bold>⭐ Prestigio</bold></gradient>"
    lore:
      - "<gray>Prestige actual: <gold>%sword_prestige%</gold>"
      - "<gray>Nivel requerido: <white>%prestige_required_level%</white>"
      - ""
      - "<yellow>Click para hacer prestigio."
    sound: UI_BUTTON_CLICK

  # Navegación páginas encantamientos
  prev-page:
    slot: 45
    material: ARROW
    name: "<red>◀ Anterior</red>"
  next-page:
    slot: 53
    material: ARROW
    name: "<green>Siguiente ▶</green>"
  close-button:
    slot: 49
    material: BARRIER
    name: "<red><bold>✖ Cerrar</bold></red>"

enchants-menu:
  title: "<gradient:#9B59B6:#3498DB><bold>✨ Encantamientos</bold></gradient>"
  rows: 6
  # Slots donde se colocan los encantamientos (filas 2-5, columnas 1-7)
  enchant-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
  border:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
  back-button:
    slot: 49
    material: ARROW
    name: "<red>◀ Volver</red>"

  # Template del item de cada encantamiento
  enchant-item-template:
    # Variables disponibles: %enchant_name%, %level%, %max_level%, %cost%, %description%, %status%
    name: "<gold><bold>%enchant_name%</bold></gold>"
    lore:
      - "<gray>%description%"
      - ""
      - "<yellow>Nivel: <white>%level% / %max_level%</white>"
      - "<yellow>Precio: <gold>%cost% %currency%</gold>"
      - ""
      - "<green>Click izquierdo: <white>Mejorar x1</white>"
      - "<aqua>Click derecho: <white>Mejorar máximo</white>"
      - "<red>Shift+Click: <white>Info detallada</white>"
    # Color del borde según estado
    border-unlocked: LIME_STAINED_GLASS_PANE
    border-locked: RED_STAINED_GLASS_PANE
    border-maxed: YELLOW_STAINED_GLASS_PANE

skins-menu:
  title: "<gradient:#FFD700:#FF8C00><bold>⚔ Skins</bold></gradient>"
  rows: 6
  # Slots donde se colocan las skins (mismo layout que enchants-menu)
  skin-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
  border:
    enabled: true
    material: ORANGE_STAINED_GLASS_PANE
    name: " "
  back-button:
    slot: 49
    material: ARROW
    name: "<red>◀ Volver</red>"
